name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infrastructure:
    name: Cloud configuration and maintenance alerts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infrastructure
      - run: terraform -chdir=infrastructure/environment init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infrastructure/environment validate
      - run: terraform -chdir=infrastructure/environment test
      - name: Check GitHub workflow syntax
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck=
      - name: Install pinned alert test utility
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/prometheus/prometheus/releases/download/v3.14.0/prometheus-3.14.0.linux-amd64.tar.gz \
            -o "$RUNNER_TEMP/prometheus.tar.gz"
          printf '%s  %s\n' \
            f665c6da19eb7ba399c915d30c7d9793c9b417bf8a749b504bc470678631478d \
            "$RUNNER_TEMP/prometheus.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/prometheus.tar.gz" -C "$RUNNER_TEMP" \
            --strip-components=1 prometheus-3.14.0.linux-amd64/promtool
      - run: node scripts/check-maintenance-alert.mjs
        env:
          LEXCERTA_PROMTOOL: ${{ runner.temp }}/promtool

  check:
    name: Node 24 behavior and static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_PASSWORD: lexcerta-local-fixture
          POSTGRES_DB: lexcerta_fixture
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d lexcerta_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:postgres
        env:
          LEXCERTA_TEST_DATABASE_URL: postgresql://postgres:lexcerta-local-fixture@127.0.0.1:5432/lexcerta_fixture
      - name: Build the runtime fixture image
        run: docker build --platform linux/amd64 --build-arg BUILD_ID="$GITHUB_SHA" -t "lexcerta-runtime-check:$GITHUB_SHA" .
      - uses: ./.github/actions/setup-release-tools
      - run: npm run test:container
        env:
          LEXCERTA_TEST_IMAGE: lexcerta-runtime-check:${{ github.sha }}
          LEXCERTA_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          LEXCERTA_TEST_DATABASE_URL: postgresql://postgres:lexcerta-local-fixture@127.0.0.1:5432/lexcerta_fixture
      - run: npm audit --audit-level=low
